# Demo users for the prototype (D1, D4). In production identity and access scope come
# from the JWT the frontend sends; this file plays the role of the access table.
#
# Brand is the only access dimension:
#   ceo     - all brands, company-wide data
#   manager - only the listed `brands` (exact `products.brand` values, case-sensitive)
users:
  ceo:
    name: Alice Morgan
    role: ceo
  denim_manager:
    name: Carlos Ruiz
    role: manager
    brands: [Levi's, Diesel, 7 For All Mankind, True Religion]
  outdoor_manager:
    name: Diana Novak
    role: manager
    brands: [The North Face, Columbia, Carhartt]
