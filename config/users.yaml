# Demo users for the prototype (D4). In production identity comes from SSO,
# and role/categories from the corporate directory.
#
# role:
#   ceo, c_level - full access to all product categories
#   executive    - category manager: access only to the listed `categories`
#                  (products.category); other categories are visible only as
#                  anonymised company-wide aggregates
users:
  ceo:
    name: Alice Morgan
    role: ceo
  cfo:
    name: Brian Chen
    role: c_level
  jeans_manager:
    name: Carlos Ruiz
    role: executive
    categories: [Jeans]
  outerwear_manager:
    name: Diana Novak
    role: executive
    categories: [Outerwear & Coats, Blazers & Jackets]

# Valid values of products.category (checked 2026-11-19). A user's categories must be
# from this list, so a typo cannot silently give an empty scope.
categories:
  - Accessories
  - Active
  - Blazers & Jackets
  - Clothing Sets
  - Dresses
  - Fashion Hoodies & Sweatshirts
  - Intimates
  - Jeans
  - Jumpsuits & Rompers
  - Leggings
  - Maternity
  - Outerwear & Coats
  - Pants
  - Pants & Capris
  - Plus
  - Shorts
  - Skirts
  - Sleep & Lounge
  - Socks
  - Socks & Hosiery
  - Suits
  - Suits & Sport Coats
  - Sweaters
  - Swim
  - Tops & Tees
  - Underwear
